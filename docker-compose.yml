version: '3'

services:
  api:
    networks:
      - bookstore
    build:
      context: .
      dockerfile: ./docker/Dockerfile-api
    ports:
      - 8000:8000
    volumes:
      - .:/go/src
    depends_on:
      - database
    container_name: bookstore_users-api
    env_file:
      - ".env"
    restart: "always"

  database:
    networks:
      - bookstore
    image: mysql:8.4
    ports:
      - 127.0.0.1:33062:3306
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d
      - ~/Docker/mysql_data:/var/lib/mysql
    container_name: bookstore_users-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${USERS_DB_NAME:?Set USERS_DB_NAME in .env}
      MYSQL_USER: ${USERS_DB_USERNAME:?Set USERS_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}

networks:
  bookstore:
